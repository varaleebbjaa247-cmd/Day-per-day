name: Daily LINE Schedule Notifier

on:
  schedule:
    # ตั้งเวลารันทุกวัน เวลา 07:00 น. เวลาไทย (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันเองเพื่อทดสอบ

jobs:
  run-notifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run LINE Schedule Notifier
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python send_line.py
        
